name: MCP tool names

on:
  push:
    branches: [main]
  pull_request:
  # A new MCP release can remove a tool with no change here.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-mcp-tools.mjs
